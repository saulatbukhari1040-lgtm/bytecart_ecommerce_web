version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: bytecart-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bytecartdb123
      POSTGRES_DB: bytecart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bytecart-app
    ports:
      - "80:3000"
    environment:
      DATABASE_URL: postgresql://postgres:bytecartdb123@db:5432/bytecart?schema=public
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cHJvdmVuLW11bGxldC03OS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_8YPuvR9oHAY5og2S3k55kjq2vve0iZ1Gy1w204DTO3
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
